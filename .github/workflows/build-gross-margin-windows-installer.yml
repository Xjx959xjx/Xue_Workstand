name: Build Gross Margin Windows Installer

on:
  workflow_dispatch:
  push:
    tags:
      - "gross-margin-v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install package dependencies
        run: npm ci

      - name: Download portable Windows Node runtime
        shell: pwsh
        run: |
          $version = "v22.22.0"
          $url = "https://nodejs.org/dist/$version/node-$version-win-x64.zip"
          New-Item -ItemType Directory -Force .vendor | Out-Null
          Invoke-WebRequest -Uri $url -OutFile .vendor\node-win-x64.zip
          Expand-Archive .vendor\node-win-x64.zip -DestinationPath .vendor -Force
          if (Test-Path .vendor\node-win-x64) { Remove-Item .vendor\node-win-x64 -Recurse -Force }
          Move-Item ".vendor\node-$version-win-x64" .vendor\node-win-x64

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build runtime and Inno script
        shell: pwsh
        timeout-minutes: 15
        env:
          WINDOWS_NODE_DIR: ${{ github.workspace }}\.vendor\node-win-x64
        run: npm run package:release -- --preset gross-margin-win-installer --skip-zip --skip-installer-compile

      - name: Inspect installer inputs
        shell: pwsh
        run: |
          Get-ChildItem dist -Recurse |
            Where-Object { $_.FullName -match 'gross-margin-win-installer|runtime\\node\\node.exe|style-library\\gross-margin' } |
            Select-Object FullName, Length |
            Format-Table -AutoSize
          $iss = Get-ChildItem dist\*gross-margin-win-installer*.iss | Select-Object -First 1
          if (-not $iss) { throw "未生成 Inno Setup .iss 脚本" }
          Get-Content $iss.FullName -TotalCount 120

      - name: Compile installer
        shell: pwsh
        timeout-minutes: 10
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "未找到 Inno Setup 编译器：$iscc" }
          $iss = Get-ChildItem dist\*gross-margin-win-installer*.iss | Select-Object -First 1
          if (-not $iss) { throw "未生成 Inno Setup .iss 脚本" }
          & $iscc $iss.FullName

      - name: Inspect installer output
        shell: pwsh
        run: |
          Get-ChildItem dist\*gross-margin-win-installer* |
            Select-Object FullName, Length |
            Format-Table -AutoSize

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gross-margin-windows-installer
          path: |
            dist/*gross-margin-win-installer*.exe
            dist/*gross-margin-win-installer*.iss
          if-no-files-found: error
